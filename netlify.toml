# Netlify build + security configuration for the Daphni Georoglidis site.
# Static export (Next.js `output: 'export'`) is built fresh on every push.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# ----------------------------------------------------------------------------
# Canonical domain — consolidate all SEO signal on https://daphni-georoglidis.de
# Every other hostname (Netlify subdomain, www, alternate spelling) 301s here.
# ----------------------------------------------------------------------------
[[redirects]]
  from = "https://daphni-website.netlify.app/*"
  to = "https://daphni-georoglidis.de/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://daphni-website.netlify.app/*"
  to = "https://daphni-georoglidis.de/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.daphni-georoglidis.de/*"
  to = "https://daphni-georoglidis.de/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://daphnigeoroglidis.de/*"
  to = "https://daphni-georoglidis.de/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.daphnigeoroglidis.de/*"
  to = "https://daphni-georoglidis.de/:splat"
  status = 301
  force = true

# ----------------------------------------------------------------------------
# Security headers (applied to every response)
# ----------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; frame-src 'none'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-DNS-Prefetch-Control = "on"

# Ensure the build-time OG image is served as PNG (file has no extension)
[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=86400"

# Service worker + manifest must revalidate so updates propagate
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Long-cache immutable build assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
